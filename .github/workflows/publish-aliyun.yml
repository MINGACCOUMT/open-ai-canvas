name: Publish images to Aliyun ACR

# 推送到阿里云容器镜像服务（ACR）。
# 需要在仓库 Settings → Secrets and variables → Actions 配置以下 Secrets：
#   ALIYUN_REGISTRY       例：registry.cn-hangzhou.aliyuncs.com（个人版）或 xxx.cr.aliyuncs.com（企业版）
#   ALIYUN_REGISTRY_NAMESPACE  命名空间，例：myname
#   ALIYUN_REGISTRY_USERNAME   阿里云镜像服务子账号 / RAM 用户名
#   ALIYUN_REGISTRY_PASSWORD   对应的镜像服务访问密码（不是阿里云登录密码）
# 触发：push 到 main、打 v* tag、或手动 workflow_dispatch

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: open-ai-canvas-web
            dockerfile: Dockerfile
          - image: open-ai-canvas-backend
            dockerfile: backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=aliyun-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=aliyun-${{ matrix.image }}
