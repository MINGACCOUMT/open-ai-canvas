# NAS 轻量部署：阿里云 ACR 镜像 + SQLite（无需 postgres/redis，适合个人使用）。
#
# 镜像 tag 规则与 ACR 实际产出一致：backend-vX.Y.Z / web-vX.Y.Z。
#
# 用法（在 NAS 上）：
#   1. 把本文件拷到 NAS 的某个目录，例如 /share/Container/open-ai-canvas/
#   2. 在同目录建 .env 文件填好镜像地址（见下方变量说明）
#   3. 若仓库私有，先 docker login registry.cn-hangzhou.aliyuncs.com
#   4. docker compose -f docker-compose.nas.yml up -d
#
# .env 文件示例（只需填这几行）：
#   ALIYUN_REGISTRY=registry.cn-hangzhou.aliyuncs.com
#   ALIYUN_NAMESPACE=koramkoin
#   CANVAS_VERSION=v1.0.49
#   CANVAS_HTTP_PORT=3000
#   # 通过 Lucky/Nginx 反代到公网域名时必须填，否则注册/登录报「不允许的跨域来源」
#   CANVAS_CORS_ORIGINS=https://canvas.example.com
#
# 数据持久化：SQLite 文件存在 ./data 目录，删容器不丢数据。

services:
  backend:
    image: ${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/open-ai-canvas:backend-${CANVAS_VERSION}
    # NAS 上挂载的 ./data 宿主属 root，容器内 app 用户无写权限会报
    # "unable to open database file"。个人 NAS 直接以 root 运行绕过权限问题。
    user: root
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: sqlite
      # 个人使用默认关闭注册，需要开放注册改为 true
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      # 是否允许后端访问内网上游（默认 false，按需开启）
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-2}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-2}
      # 反代到公网域名时必填，逗号分隔多个源；本地直连访问可不设。
      # 漏配会导致浏览器注册/登录报「不允许的跨域来源」(403)。
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-}
      GIN_MODE: release
    volumes:
      - ${CANVAS_DATA_PATH:-./data}:/data
    restart: unless-stopped

  web:
    image: ${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/open-ai-canvas:web-${CANVAS_VERSION}
    ports:
      - "${CANVAS_HTTP_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
